fair_castle_choice: 'انتخاب منصفانهٔ قلعهٔ هوش مصنوعی'
fair_castle_choice_descr: 'اگر چند نقشهٔ قلعه به یک اندازه با جایگاه شروع هوش مصنوعی تناسب داشته باشند، یکی از آن‌ها با عدد تصادفی بازی انتخاب می‌شود. در غیر این صورت بازی بیشتر اولی را برمی‌دارد.'
